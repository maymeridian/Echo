[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicematch"
version = "0.1.0"
description = "Practice a voice impression and measure how close you get."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "librosa>=0.10.2",
    "praat-parselmouth>=0.4.4",
    "soundfile",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
voicematch = "voicematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicematch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
