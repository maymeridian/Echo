[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicematch"
version = "0.1.0"
description = "Practice a voice impression and measure how close you get."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "librosa>=0.10.2",
    "praat-parselmouth>=0.4.4",
    "soundfile",
    "fastapi",
    "uvicorn",
    "onnxruntime>=1.17",
    "kaldi-native-fbank>=1.20",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
e2e = ["playwright"]  # drives the installed Edge or Chrome; no browser download

[project.scripts]
voicematch = "voicematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicematch = ["static/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
