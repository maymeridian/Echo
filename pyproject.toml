[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-voice"
dynamic = ["version"]
description = "Practise a voice impression and measure how close you get."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "May (maymeridian)" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "librosa>=0.10.2",
    "praat-parselmouth>=0.4.4",
    "soundfile",
    "fastapi",
    "uvicorn",
    "onnxruntime>=1.17",
    "kaldi-native-fbank>=1.20",
    "faster-whisper>=1.0",
    "sherpa-onnx>=1.12",
    "yt-dlp[default]",  # video links; YouTube changes often, so keep it current
]

[project.urls]
Homepage = "https://maymeridian.dev/projects/echo/"
Source = "https://github.com/maymeridian/Echo"
Changelog = "https://github.com/maymeridian/Echo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
e2e = ["playwright"]  # drives the installed Edge or Chrome; no browser download

[project.scripts]
echo-voice = "echo_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "echo_voice.__version__" }

[tool.setuptools.package-data]
echo_voice = ["static/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]  # zip() over arrays of one length; strict= would only add noise

[tool.ruff.format]
quote-style = "preserve"  # double quotes in code, ''' for each file's header
